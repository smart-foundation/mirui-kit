[package]
name = "mirui-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
mirui = { workspace = true, features = ["quad-aa"] }
mirx.workspace = true

[features]
# The regular weight is always compiled in; every other weight is behind a
# feature, because a weight is around two megabytes of atlas.
default = ["weight-medium", "weight-semibold"]
weight-medium = []
weight-semibold = []
weight-thin = []
weight-extralight = []
weight-light = []
weight-bold = []
weight-extrabold = []
weight-black = []
weights-all = [
    "weight-medium",
    "weight-semibold",
    "weight-thin",
    "weight-extralight",
    "weight-light",
    "weight-bold",
    "weight-extrabold",
    "weight-black",
]

