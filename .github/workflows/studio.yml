name: Mirui suite checks
on:
  push:
    branches: [master, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      export_review:
        description: Export exact native route PNGs through the Checks API for restricted reviewers
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-24
          targets: riscv64gc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Native host dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libwayland-dev pkg-config
      - name: Visual comparison regression checks
        run: python3 tools/test-visual-comparison.py
      - name: Shared kit behavior tests and no_std check
        run: sh tools/test-kit-behavior.sh
      - name: Full workspace tests, including existing Files regressions
        run: python3 tools/ci-check.py cargo test --locked --workspace --no-fail-fast
      - name: no_std Studio on RISC-V
        if: ${{ !cancelled() }}
        run: python3 tools/ci-check.py cargo check --locked -p studio --no-default-features --target riscv64gc-unknown-none-elf
      - name: SDL host compilation
        if: ${{ !cancelled() }}
        run: python3 tools/ci-check.py cargo check --locked -p studio-host --features desktop --bin studio-desktop
      - name: Shared selection policy and no_std check
        if: ${{ !cancelled() }}
        run: sh tools/test-editing-policy.sh
      - name: Pinned upstream macro parsing and lowering
        if: ${{ !cancelled() }}
        run: python3 tools/check-mirui-syntax.py
      - name: Fresh route and overlay captures
        if: ${{ !cancelled() }}
        run: python3 tools/ci-check.py cargo run --locked -p studio-host --bin studio-snapshot -- --out artifacts/studio
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: studio-review-captures
          path: artifacts/studio
          if-no-files-found: error

  native-review:
    needs: checks
    if: ${{ !cancelled() && (inputs.export_review || contains(github.event.head_commit.message, '[capture-review]')) }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        route: ["01", "02", "03", "04", "05", "06"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-review-captures
          path: artifacts/studio
      - name: Exact native PNG evidence batch 1
        run: python3 tools/export-capture-evidence.py artifacts/studio/s${{ matrix.route }}-*.png 1
      - name: Exact native PNG evidence batch 2
        run: python3 tools/export-capture-evidence.py artifacts/studio/s${{ matrix.route }}-*.png 2
      - name: Exact native PNG evidence batch 3
        run: python3 tools/export-capture-evidence.py artifacts/studio/s${{ matrix.route }}-*.png 3
      - name: Exact native PNG evidence batch 4
        run: python3 tools/export-capture-evidence.py artifacts/studio/s${{ matrix.route }}-*.png 4

  component-review:
    needs: checks
    if: ${{ !cancelled() && (inputs.export_review || contains(github.event.head_commit.message, '[capture-review]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        theme: [dark, light]
        scale: [100, 150]
        width: [640, 960]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-24
      - uses: Swatinem/rust-cache@v2
      - name: Native host dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libwayland-dev pkg-config
      - name: Capture isolated native components and meaningful states
        run: python3 tools/ci-check.py cargo run --locked -p studio-host --bin component-snapshot -- --out artifacts/studio/components --theme ${{ matrix.theme }} --scale ${{ matrix.scale }} --width ${{ matrix.width }}
      - name: Check reviewed baselines, report unreviewed captures honestly
        run: python3 tools/compare-native-captures.py artifacts/studio/components --baseline docs/visual-baselines --out artifacts/studio/component-differences --allow-missing
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: components-${{ matrix.theme }}-${{ matrix.scale }}-${{ matrix.width }}
          path: |
            artifacts/studio/components
            artifacts/studio/component-differences
          if-no-files-found: error
