name: Mirui suite checks
on:
  push:
    branches: [master, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      export_review:
        description: Export exact native route PNGs through the Checks API for restricted reviewers
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-24
          targets: riscv64gc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Native host dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libwayland-dev pkg-config
      - name: Shared kit behavior tests and no_std check
        run: sh tools/test-kit-behavior.sh
      - name: Full workspace tests, including existing Files regressions
        run: python3 tools/ci-check.py cargo test --locked --workspace --no-fail-fast
      - name: no_std Studio on RISC-V
        if: ${{ !cancelled() }}
        run: python3 tools/ci-check.py cargo check --locked -p studio --no-default-features --target riscv64gc-unknown-none-elf
      - name: SDL host compilation
        if: ${{ !cancelled() }}
        run: python3 tools/ci-check.py cargo check --locked -p studio-host --features desktop --bin studio-desktop
      - name: Shared selection policy and no_std check
        if: ${{ !cancelled() }}
        run: sh tools/test-editing-policy.sh
      - name: Pinned upstream macro parsing and lowering
        if: ${{ !cancelled() }}
        run: python3 tools/check-mirui-syntax.py
      - name: Fresh route and overlay captures
        if: ${{ !cancelled() }}
        run: python3 tools/ci-check.py cargo run --locked -p studio-host --bin studio-snapshot -- --out artifacts/studio
      - name: Export native route 1 review evidence
        if: ${{ !cancelled() && (inputs.export_review || contains(github.event.head_commit.message, '[capture-review]')) }}
        run: python3 tools/export-capture-evidence.py artifacts/studio/s01-*.png
      - name: Export native route 2 review evidence
        if: ${{ !cancelled() && (inputs.export_review || contains(github.event.head_commit.message, '[capture-review]')) }}
        run: python3 tools/export-capture-evidence.py artifacts/studio/s02-*.png
      - name: Export native route 3 review evidence
        if: ${{ !cancelled() && (inputs.export_review || contains(github.event.head_commit.message, '[capture-review]')) }}
        run: python3 tools/export-capture-evidence.py artifacts/studio/s03-*.png
      - name: Export native route 4 review evidence
        if: ${{ !cancelled() && (inputs.export_review || contains(github.event.head_commit.message, '[capture-review]')) }}
        run: python3 tools/export-capture-evidence.py artifacts/studio/s04-*.png
      - name: Export native route 5 review evidence
        if: ${{ !cancelled() && (inputs.export_review || contains(github.event.head_commit.message, '[capture-review]')) }}
        run: python3 tools/export-capture-evidence.py artifacts/studio/s05-*.png
      - name: Export native route 6 review evidence
        if: ${{ !cancelled() && (inputs.export_review || contains(github.event.head_commit.message, '[capture-review]')) }}
        run: python3 tools/export-capture-evidence.py artifacts/studio/s06-*.png
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: studio-review-captures
          path: artifacts/studio
          if-no-files-found: error
