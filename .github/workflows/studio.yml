name: Mirui suite checks
on:
  push:
    branches: [master, arena/db7ace04-mirui-kit]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-24
          targets: riscv64gc-unknown-none-elf
      - name: Native host dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libwayland-dev pkg-config
      - name: Full workspace tests, including existing Files regressions
        run: cargo test --locked --workspace
      - name: no_std Studio on RISC-V
        run: cargo check --locked -p studio --no-default-features --target riscv64gc-unknown-none-elf
      - name: SDL host compilation
        run: cargo check --locked -p studio-host --features desktop --bin studio-desktop
      - name: Shared selection policy and no_std check
        run: sh tools/test-editing-policy.sh
      - name: Pinned upstream macro parsing and lowering
        run: python3 tools/check-mirui-syntax.py
      - name: Fresh route and overlay captures
        run: cargo run --locked -p studio-host --bin studio-snapshot -- --out artifacts/studio
      - uses: actions/upload-artifact@v4
        with:
          name: studio-review-captures
          path: artifacts/studio
          if-no-files-found: error
